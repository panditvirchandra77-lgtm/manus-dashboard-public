<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parmar Family Temple — 3D View</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+Devanagari:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0608;
    font-family: 'Cinzel', serif;
    color: #f5d78e;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 60%, #1a0a00 0%, #0a0608 70%);
  }

  canvas { display: block; }

  /* Top title */
  .title-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 14px 20px 10px;
    background: linear-gradient(to bottom, rgba(10,6,8,0.95), transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .title-bar h1 {
    font-size: 15px;
    letter-spacing: 3px;
    color: #f5d78e;
    text-shadow: 0 0 20px rgba(245,215,142,0.5);
  }
  .title-bar .sub {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 11px;
    color: #c4914a;
    letter-spacing: 1px;
  }
  .architect-tag {
    font-size: 9px;
    color: #7a5530;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Controls */
  .controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 20px 16px;
    background: linear-gradient(to top, rgba(10,6,8,0.95), transparent);
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    z-index: 10;
  }
  .btn {
    background: rgba(245,215,142,0.08);
    border: 1px solid rgba(245,215,142,0.25);
    color: #f5d78e;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn:active, .btn.active {
    background: rgba(245,215,142,0.2);
    border-color: #f5d78e;
    box-shadow: 0 0 12px rgba(245,215,142,0.3);
  }

  /* Touch hint */
  .hint {
    position: fixed;
    top: 55px;
    right: 14px;
    font-size: 9px;
    color: #5a3820;
    letter-spacing: 1px;
    text-align: right;
    line-height: 1.8;
    z-index: 10;
  }

  /* Om symbol overlay */
  .om-symbol {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 120px;
    color: rgba(245,215,142,0.03);
    pointer-events: none;
    z-index: 1;
    user-select: none;
  }

  /* Legend */
  .legend {
    position: fixed;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 8px;
    letter-spacing: 1.2px;
    color: #8a6030;
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div class="om-symbol">ॐ</div>

<div class="title-bar">
  <div>
    <h1>PARMAR FAMILY TEMPLE</h1>
    <div class="sub">पारमार परिवार मंदिर • 3D View</div>
  </div>
  <div style="text-align:right">
    <div class="architect-tag">LL Associates</div>
    <div class="architect-tag">10 Feb 2026</div>
  </div>
</div>

<div class="hint">
  Drag to rotate<br>
  Pinch to zoom<br>
  Two-finger pan
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#d4a84b"></div>Sanctum</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b7355"></div>Temple Hall</div>
  <div class="legend-item"><div class="legend-dot" style="background:#6b8f5e"></div>Garden</div>
  <div class="legend-item"><div class="legend-dot" style="background:#c47a45"></div>Plinth</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5a4535"></div>Canopy</div>
</div>

<div class="controls">
  <button class="btn" id="btn-reset">Reset View</button>
  <button class="btn" id="btn-top">Top View</button>
  <button class="btn" id="btn-front">Front View</button>
  <button class="btn" id="btn-inside">Inside</button>
  <button class="btn" id="btn-auto" class="active">Auto Rotate</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ───────────────────────────────────────────
const container = document.getElementById('canvas-container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.035);

const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);
camera.position.set(8, 7, 12);
camera.lookAt(0, 2, 0);

// ─── Lighting ──────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffe8c0, 0.3);
scene.add(ambient);

// Main sun — east facing (from right/east side)
const sunLight = new THREE.DirectionalLight(0xffd080, 1.8);
sunLight.position.set(10, 15, 5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 60;
sunLight.shadow.camera.left = -15;
sunLight.shadow.camera.right = 15;
sunLight.shadow.camera.top = 15;
sunLight.shadow.camera.bottom = -15;
scene.add(sunLight);

// Warm fill from front
const fillLight = new THREE.DirectionalLight(0xff9040, 0.5);
fillLight.position.set(-5, 5, 8);
scene.add(fillLight);

// Sanctum glow — warm deity light
const sanctumGlow = new THREE.PointLight(0xffaa30, 2.5, 6);
sanctumGlow.position.set(0, 2, -3.5);
scene.add(sanctumGlow);

// Diya lights (two small warm flickering points)
const diya1 = new THREE.PointLight(0xff6020, 1.2, 3);
diya1.position.set(-0.8, 1.2, -2.5);
scene.add(diya1);
const diya2 = new THREE.PointLight(0xff6020, 1.2, 3);
diya2.position.set(0.8, 1.2, -2.5);
scene.add(diya2);

// ─── Materials ────────────────────────────────────────────
const matStone = new THREE.MeshStandardMaterial({ color: 0xe8d5a8, roughness: 0.8, metalness: 0.05 });
const matPlinth = new THREE.MeshStandardMaterial({ color: 0xc47a45, roughness: 0.7, metalness: 0.05 });
const matWall = new THREE.MeshStandardMaterial({ color: 0xf0e0b0, roughness: 0.75, metalness: 0.02 });
const matRoof = new THREE.MeshStandardMaterial({ color: 0xb07040, roughness: 0.6, metalness: 0.1 });
const matShikhar = new THREE.MeshStandardMaterial({ color: 0xd4a84b, roughness: 0.4, metalness: 0.3 });
const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8, emissive: 0xaa7700, emissiveIntensity: 0.3 });
const matGarden = new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: 0.9 });
const matPath = new THREE.MeshStandardMaterial({ color: 0xb09060, roughness: 0.8 });
const matWood = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.85, metalness: 0.05 });
const matCanopy = new THREE.MeshStandardMaterial({ color: 0x8b6340, roughness: 0.7, metalness: 0.1 });
const matIdol = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.3, metalness: 0.6, emissive: 0x220011, emissiveIntensity: 0.2 });
const matStep = new THREE.MeshStandardMaterial({ color: 0xd4b896, roughness: 0.7 });

// ─── Helper ───────────────────────────────────────────────
function box(w, h, d, mat, x, y, z, rx=0, ry=0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.x = rx; m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function cone(r, h, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function sphere(r, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}

// ─── Ground ───────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1.0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ─── Garden (south side) ──────────────────────────────────
box(8, 0.05, 5, matGarden, 0, 0.03, 5);

// Garden path
box(1.2, 0.06, 3, matPath, 0, 0.04, 4.5);

// Tree (south garden)
cyl(0.25, 0.35, 2.5, 8, matWood, -2, 1.25, 6);
sphere(1.5, 8, new THREE.MeshStandardMaterial({ color: 0x2d5a1e, roughness: 0.9 }), -2, 3.2, 6);
sphere(0.9, 8, new THREE.MeshStandardMaterial({ color: 0x3d7a2e, roughness: 0.9 }), -1.2, 2.5, 5.5);

// ─── Plinth / Platform ────────────────────────────────────
box(7, 0.5, 7, matPlinth, 0, 0.25, 0);

// Steps (south entry — 3 steps)
box(2.5, 0.18, 0.5, matStep, 0, 0.09, 3.2);
box(2.5, 0.35, 0.5, matStep, 0, 0.17, 2.8);
box(2.5, 0.5, 0.5, matStep, 0, 0.25, 2.4);

// ─── Entry Canopy / Lobby ─────────────────────────────────
// Canopy pillars
[-1, 1].forEach(x => {
  cyl(0.12, 0.14, 2.2, 8, matCanopy, x, 1.6, 2.0);
});
// Canopy roof beam
box(2.8, 0.18, 0.5, matCanopy, 0, 2.75, 2.0);
// Canopy slab
box(2.8, 0.12, 0.7, new THREE.MeshStandardMaterial({ color: 0xa07848, roughness: 0.6 }), 0, 2.85, 2.0);

// ─── Temple Hall Walls (12'3" x 10'0" approx 3.7m x 3m) ─
const hallW = 4, hallD = 3.5, wallH = 3.2, wallT = 0.22;

// Floor inside
box(hallW - wallT*2, 0.08, hallD - wallT*2, matStone, 0, 0.54, -0.5);

// Walls
box(hallW, wallH, wallT, matWall, 0, wallH/2 + 0.5, (hallD/2));       // front wall
box(hallW, wallH, wallT, matWall, 0, wallH/2 + 0.5, -(hallD/2));      // back wall
box(wallT, wallH, hallD, matWall, -(hallW/2), wallH/2 + 0.5, -0.5);  // left
box(wallT, wallH, hallD, matWall, (hallW/2), wallH/2 + 0.5, -0.5);   // right

// Door opening — carve visually with a darker box
const doorMat = new THREE.MeshStandardMaterial({ color: 0x1a0d00, roughness: 1.0 });
box(1.0, 2.2, 0.3, doorMat, 0, 1.6 + 0.5, hallD/2);

// Wooden door frame
[-0.55, 0.55].forEach(x => box(0.07, 2.2, 0.25, matWood, x, 1.6 + 0.5, hallD/2));
box(1.1, 0.08, 0.25, matWood, 0, 2.7 + 0.5, hallD/2);

// Wooden railings (both sides of hall)
[-1.7, 1.7].forEach(x => {
  box(0.06, 0.8, 3, matWood, x, 1.1, -0.5);
  for(let z = -1.5; z <= 1.5; z += 0.4) {
    box(0.04, 0.7, 0.04, matWood, x, 0.95, z);
  }
});

// ─── Hall Roof ─────────────────────────────────────────────
// Flat ceiling slab
box(hallW + 0.3, 0.2, hallD + 0.3, matRoof, 0, wallH + 0.5 + 0.1, -0.5);

// Cornice decorative strip
box(hallW + 0.5, 0.15, hallD + 0.5, new THREE.MeshStandardMaterial({ color: 0xc8a060, roughness: 0.5 }), 0, wallH + 0.5 - 0.1, -0.5);

// ─── Sanctum / Garbhagriha ────────────────────────────────
const sW = 2.5, sD = 2.5, sH = 2.8;
const sX = 0, sZ = -hallD/2 - sD/2 - wallT;

// Sanctum walls
box(sW, sH, wallT, matStone, sX, sH/2 + 0.5, sZ + sD/2);
box(sW, sH, wallT, matStone, sX, sH/2 + 0.5, sZ - sD/2);
box(wallT, sH, sD, matStone, sX - sW/2, sH/2 + 0.5, sZ);
box(wallT, sH, sD, matStone, sX + sW/2, sH/2 + 0.5, sZ);

// Sanctum arch / entry
box(1.0, 2.0, 0.25, doorMat, sX, 1.5 + 0.5, sZ + sD/2);
// Decorative arch lintel
box(1.2, 0.2, 0.2, matGold, sX, 2.5 + 0.5, sZ + sD/2);

// ─── Shikhar (Shikhara — tower over sanctum) ──────────────
const shiTop = sH + 0.5;
// Base of shikhar
box(sW + 0.2, 0.25, sD + 0.2, matShikhar, sX, shiTop + 0.12, sZ);

// Multi-tiered shikhar — stacked cones / boxes
const tiers = [
  [sW*0.9, 0.6, sZ],
  [sW*0.75, 0.6, sZ],
  [sW*0.6, 0.55, sZ],
  [sW*0.45, 0.5, sZ],
  [sW*0.3, 0.45, sZ],
];
let ty = shiTop + 0.25;
tiers.forEach(([size, h, z]) => {
  box(size, h, size, matShikhar, sX, ty + h/2, z);
  ty += h;
});

// Final amalaka (disc) and kalash
cyl(0.35, 0.35, 0.18, 16, new THREE.MeshStandardMaterial({ color: 0xc8960a, roughness: 0.3, metalness: 0.5 }), sX, ty + 0.09, sZ);
ty += 0.18;
// Kalash (pot finial)
cyl(0.08, 0.25, 0.4, 16, matGold, sX, ty + 0.2, sZ);
ty += 0.4;
sphere(0.2, 16, matGold, sX, ty + 0.2, sZ);
ty += 0.4;
// Trishul / flag pole
cyl(0.025, 0.025, 0.8, 8, new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.9 }), sX, ty + 0.4, sZ);

// ─── Idol / Murti inside sanctum ─────────────────────────
// Pedestal
cyl(0.3, 0.4, 0.4, 12, new THREE.MeshStandardMaterial({ color: 0xf0e8d0, roughness: 0.5, metalness: 0.1 }), sX, 0.7, sZ - 0.3);
// Murti body
cyl(0.18, 0.22, 0.8, 8, matIdol, sX, 1.3, sZ - 0.3);
sphere(0.2, 12, matIdol, sX, 1.75, sZ - 0.3);
// Halo
const haloGeo = new THREE.TorusGeometry(0.28, 0.025, 8, 24);
const haloMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.8 });
const halo = new THREE.Mesh(haloGeo, haloMat);
halo.position.set(sX, 1.75, sZ - 0.48);
halo.rotation.y = Math.PI/2;
halo.castShadow = false;
scene.add(halo);

// Diya stands
[-0.5, 0.5].forEach(x => {
  cyl(0.04, 0.06, 0.3, 8, matGold, sX + x, 0.65, sZ + 0.3);
  cyl(0.1, 0.08, 0.04, 12, matGold, sX + x, 0.82, sZ + 0.3);
});

// ─── Columns at temple front ──────────────────────────────
[-1.7, 1.7].forEach(x => {
  cyl(0.15, 0.2, wallH + 0.5, 12, matStone, x, (wallH + 0.5)/2 + 0.5, hallD/2);
  // Capital
  cyl(0.28, 0.15, 0.18, 12, matShikhar, x, wallH + 0.5 + 0.59, hallD/2);
});

// ─── Boundary / Compound wall ────────────────────────────
const bH = 0.9, bT = 0.18;
// North wall
box(9, bH, bT, matPlinth, 0, bH/2, -6);
// South wall with gate gap
box(3.5, bH, bT, matPlinth, -2.75, bH/2, 5.5);
box(3.5, bH, bT, matPlinth, 2.75, bH/2, 5.5);
// Gate pillars
[-0.75, 0.75].forEach(x => {
  cyl(0.18, 0.2, 1.4, 8, matShikhar, x, 0.7, 5.5);
  sphere(0.22, 8, matGold, x, 1.45, 5.5);
});
// East/West walls
box(bT, bH, 11.5, matPlinth, -4.5, bH/2, -0.25);
box(bT, bH, 11.5, matPlinth, 4.5, bH/2, -0.25);

// ─── Flagpole with flag ───────────────────────────────────
cyl(0.04, 0.06, 5, 8, matWood, 3.5, 2.5, -4.5);
const flagGeo = new THREE.PlaneGeometry(0.8, 0.5);
const flagMat = new THREE.MeshStandardMaterial({ color: 0xff6600, side: THREE.DoubleSide, roughness: 0.9 });
const flag = new THREE.Mesh(flagGeo, flagMat);
flag.position.set(3.9, 5.0, -4.5);
flag.castShadow = false;
scene.add(flag);

// ─── Particle system — sparkling dust ─────────────────────
const particleCount = 200;
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  positions[i*3]   = (Math.random() - 0.5) * 14;
  positions[i*3+1] = Math.random() * 10;
  positions[i*3+2] = (Math.random() - 0.5) * 14;
}
const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({ color: 0xffd080, size: 0.04, transparent: true, opacity: 0.6 });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ─── Camera Controls (touch + mouse) ─────────────────────
let isDragging = false;
let prevX = 0, prevY = 0;
let rotX = 0.3, rotY = 0.4;
let zoom = 1.0;
let autoRotate = true;
let targetX = rotX, targetY = rotY;
let camRadius = 16;

const pivotY = 2.0;

function updateCamera() {
  const r = camRadius * zoom;
  camera.position.x = r * Math.sin(rotY) * Math.cos(rotX);
  camera.position.y = pivotY + r * Math.sin(rotX);
  camera.position.z = r * Math.cos(rotY) * Math.cos(rotX);
  camera.lookAt(0, pivotY, 0);
}

// Mouse
renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; autoRotate = false; document.getElementById('btn-auto').classList.remove('active'); });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.008;
  rotX -= (e.clientY - prevY) * 0.006;
  rotX = Math.max(-0.05, Math.min(1.2, rotX));
  prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => { zoom *= e.deltaY > 0 ? 1.08 : 0.93; zoom = Math.max(0.4, Math.min(3, zoom)); });

// Touch
let lastDist = 0;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; autoRotate = false; document.getElementById('btn-auto').classList.remove('active'); }
  if (e.touches.length === 2) { lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
});
renderer.domElement.addEventListener('touchend', () => isDragging = false);
renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    rotY += (e.touches[0].clientX - prevX) * 0.009;
    rotX -= (e.touches[0].clientY - prevY) * 0.007;
    rotX = Math.max(-0.05, Math.min(1.2, rotX));
    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
  }
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    zoom *= lastDist / d;
    zoom = Math.max(0.4, Math.min(3, zoom));
    lastDist = d;
  }
}, { passive: false });

// ─── Buttons ──────────────────────────────────────────────
document.getElementById('btn-reset').onclick = () => { rotX = 0.3; rotY = 0.4; zoom = 1.0; };
document.getElementById('btn-top').onclick = () => { rotX = 1.15; rotY = 0.4; zoom = 0.85; autoRotate = false; };
document.getElementById('btn-front').onclick = () => { rotX = 0.15; rotY = Math.PI; zoom = 0.85; autoRotate = false; };
document.getElementById('btn-inside').onclick = () => { rotX = 0.1; rotY = Math.PI + 0.2; zoom = 0.6; autoRotate = false; camera.lookAt(0, 1.5, -3); };
document.getElementById('btn-auto').onclick = function() {
  autoRotate = !autoRotate;
  this.classList.toggle('active', autoRotate);
};

// ─── Animation ────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  // Auto rotate
  if (autoRotate) rotY += 0.004;

  // Diya flicker
  const flicker = Math.sin(t * 7.3) * 0.15 + Math.sin(t * 13.1) * 0.08;
  diya1.intensity = 1.2 + flicker;
  diya2.intensity = 1.2 - flicker;
  sanctumGlow.intensity = 2.5 + Math.sin(t * 2.1) * 0.3;

  // Halo slow spin
  halo.rotation.z += 0.003;

  // Particle slow float
  const pos = particleGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pos[i*3+1] += 0.002;
    if (pos[i*3+1] > 10) pos[i*3+1] = 0;
  }
  particleGeo.attributes.position.needsUpdate = true;

  // Flag wave
  flag.rotation.y = Math.sin(t * 1.5) * 0.3;

  updateCamera();
  renderer.render(scene, camera);
}

// Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate();
</script>
</body>
</html>
